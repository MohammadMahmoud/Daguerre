[package]
name = "daguerre"
version = "1.0.7"
description = "Daguerre desktop: capture, annotate and export screenshots on your device."
license = "MIT"
edition = "2021"
rust-version = "1.90"

[lib]
name = "daguerre_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-autostart = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
xcap = "0.9"
serde = { version = "1", features = ["derive"] }
# generate_context! embeds the `plugins` config (updater) with serde_json.
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13.13", default-features = false, features = ["tokio", "screenshot"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

# Image encoding and capture are unbearably slow unoptimized.
[profile.dev.package."*"]
opt-level = 3
