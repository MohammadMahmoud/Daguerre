name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Unit tests with coverage (fails below 80%)
        run: pnpm coverage
      - name: Coverage badge and job summary
        run: pnpm coverage:badge
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  package:
    name: Build extension package
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Release notes for this version (checks versions match)
        run: pnpm release-notes
      - name: Build, test and zip
        run: pnpm package
      - id: meta
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          mv daguerre.zip "daguerre-$version.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: daguerre-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha }}
          path: |
            daguerre-*.zip
            release-notes.md
          if-no-files-found: error

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: daguerre-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: daguerre-${{ needs.package.outputs.version }}.zip

  pages:
    name: Showcase, privacy policy and coverage badge
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: _site/coverage
      - name: Assemble site
        run: cp -r store/index.html store/privacy.html store/icon.png store/hero.png store/screenshots store/promo-small-440x280.png _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
