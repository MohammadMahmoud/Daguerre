name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_ref:
        description: Immutable release commit to build
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Quality, tests and extension build
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.which.outputs.desktop }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref || github.sha }}
          fetch-depth: 0
      # Every desktop/unified release also ships the latest extension build.
      - name: Detect changed targets
        id: which
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          RELEASE_REF: ${{ inputs.release_ref }}
        run: |
          if [ -n "$RELEASE_REF" ]; then
            printf 'extension=true\ndesktop=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT" = pull_request ]; then node scripts/Changed.mjs "origin/$BASE_REF"
          elif [ "$EVENT" = push ]; then node scripts/Changed.mjs "$BEFORE"
          else printf 'extension=true\ndesktop=true\n' >> "$GITHUB_OUTPUT"; fi
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - name: Unit tests with coverage (fails below 80%)
        run: pnpm coverage
      - name: Coverage badge and job summary
        run: pnpm coverage:badge
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
      - name: Build and package extension (dist + crx)
        if: steps.which.outputs.extension == 'true'
        run: |
          pnpm vite build
          node scripts/PackageExtension.mjs
      - uses: actions/upload-artifact@v7
        if: steps.which.outputs.extension == 'true'
        with:
          name: extension-dist
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: steps.which.outputs.extension == 'true'
        with:
          name: extension-crx
          path: daguerre.crx
          if-no-files-found: error

  desktop-check:
    name: Desktop checks
    needs: test
    # Releases and manual dispatches run desktop-build directly instead of compiling Rust twice.
    if: >-
      needs.test.outputs.desktop == 'true' &&
      github.event_name != 'workflow_call' &&
      github.event_name != 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref || github.sha }}
      - name: Linux system libraries (webview, tray, screen capture)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            pkg-config libclang-dev libxcb1-dev libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libwayland-dev libegl-dev libgbm-dev dbus-daemon
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - run: pnpm install --frozen-lockfile
      # The Rust build embeds the frontend, so it must exist before clippy and tests.
      - run: pnpm vite build --mode desktop
      - name: Format, lint and unit tests
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
      - name: Screenshot portal lifecycle
        if: runner.os == 'Linux'
        working-directory: src-tauri
        run: dbus-run-session -- cargo test portal_request_lifecycle -- --ignored

  desktop-build:
    name: Installers
    # Starts immediately in parallel with test on release runs or manual dispatches.
    if: github.event_name == 'workflow_call' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: Windows
            os: windows-latest
            args: --bundles nsis,msi
          - name: Linux
            os: ubuntu-24.04
            args: --bundles appimage,deb,rpm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref || github.sha }}
      - name: Linux system libraries (webview, tray, screen capture)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            pkg-config libclang-dev libxcb1-dev libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libwayland-dev libegl-dev libgbm-dev
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: release
          cache-all-crates: true
      - run: pnpm install --frozen-lockfile
      # Empty variables would make Tauri try to sign, so only set the ones that exist.
      - name: macOS signing and notarization (when the secrets are set)
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!name}" ] || continue
            delimiter="EOF_$(openssl rand -hex 8)"
            { echo "$name<<$delimiter"; echo "${!name}"; echo "$delimiter"; } >> "$GITHUB_ENV"
          done
      - name: Build installers
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        # Updater artifacts (.sig, .app.tar.gz) need the signing key; without it the release has no latest.json.
        run: |
          updater=()
          [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && updater=(--config '{"bundle":{"createUpdaterArtifacts":true}}')
          pnpm tauri build ${{ matrix.args }} "${updater[@]}"
      - uses: actions/upload-artifact@v7
        with:
          name: daguerre-desktop-${{ matrix.name }}
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/macos/*.app.tar.gz
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/rpm/*.rpm
            src-tauri/target/**/release/bundle/**/*.sig
          if-no-files-found: error

  pages:
    name: Showcase, privacy policy and coverage badge
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: _site/coverage
      - name: Assemble site
        run: cp -r store/index.html store/privacy.html store/icon.png store/hero.png store/screenshots store/desktop store/promo-small-440x280.png _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
