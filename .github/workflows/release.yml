name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - '!v*-*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to build and publish
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release tag and changelog
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Verify tag, synchronized manifests and changelog
        id: check
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi
          GITHUB_REF_TYPE=tag GITHUB_REF_NAME="$TAG" node scripts/ReleaseNotes.mjs all
          {
            echo "tag=$TAG"
            echo "version=${TAG#v}"
            echo "sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build and verify both targets
    needs: verify
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/ci.yml
    with:
      release_ref: ${{ needs.verify.outputs.sha }}
    secrets: inherit

  publish:
    name: Publish desktop and extension assets
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Extract release body from committed changelog
        run: node scripts/ReleaseNotes.mjs all
      - uses: actions/download-artifact@v4
        with:
          pattern: daguerre-desktop-*
          merge-multiple: true
          path: installers
      - uses: actions/download-artifact@v4
        with:
          name: extension-dist
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: extension-crx
          path: .
      - name: Package extension alongside installers
        run: |
          mkdir out
          zip -qrX "out/daguerre-extension-dist-v$VERSION.zip" dist -x '*/.*'
          (cd dist && zip -qrX ../daguerre-webstore.zip . -x '*/.*')
          mv daguerre.crx "out/daguerre-extension-v$VERSION.crx"
          find installers -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.msi' \
            -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.app.tar.gz' -o -name '*.sig' \) -exec mv {} out/ \;
          test -n "$(find out -name '*.dmg' -print -quit)"
          test -n "$(find out -name '*.exe' -print -quit)"
          test -n "$(find out -name '*.AppImage' -print -quit)"
          node scripts/UpdaterManifest.mjs out "$VERSION" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/v$VERSION" .release-notes.md
          cd out && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.verify.outputs.tag }}
          target_commitish: ${{ needs.verify.outputs.sha }}
          name: Daguerre ${{ needs.verify.outputs.version }}
          body_path: .release-notes.md
          files: out/*
          fail_on_unmatched_files: true
          make_latest: true
      - name: Upload and publish to Chrome Web Store
        if: env.CHROME_EXTENSION_ID != ''
        uses: mnao305/chrome-extension-upload@v5.0.0
        with:
          file-path: daguerre-webstore.zip
          extension-id: ${{ secrets.CHROME_EXTENSION_ID }}
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}
          publish: true
